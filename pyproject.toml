[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-agent-platform"
version = "0.1.0"
description = "Self-hosted AI agent platform for engineering reliability analysis: RBAC, human approval, audit, evals, observability."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "bcrypt>=4.1",
  "PyJWT>=2.8",
  # Required by FastAPI to parse OAuth2 form bodies (application/x-www-form-urlencoded).
  "python-multipart>=0.0.9",
  "celery>=5.3",
  "redis>=5.0",
  "openai>=1.0",
  "lifelines>=0.28",
  "numpy>=1.26",
  "pandas>=2.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["api*", "agents*", "tools*", "validators*", "audit*", "rag*", "evals*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
